<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>山菜手帳 テスト</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root">読み込み中...</div>
  <script>
    window.onerror = function(msg,src,line){
      document.getElementById('root').innerHTML = '⚠️ エラー: ' + msg + ' (行:' + line + ')';
    };

    const { useState } = React;

    function App() {
      const [count, setCount] = useState(0);
      return React.createElement('div', {
        style: {textAlign:'center', padding:'40px', fontFamily:'sans-serif', color:'#2d4a2d'}
      },
        React.createElement('div', {style:{fontSize:'48px'}}, '🌿'),
        React.createElement('h1', null, '山菜採り手帳'),
        React.createElement('p', null, '動作確認OK！'),
        React.createElement('button', {
          onClick: () => setCount(count + 1),
          style: {background:'#2d4a2d', color:'white', border:'none', padding:'10px 20px', borderRadius:'8px', cursor:'pointer', fontSize:'16px'}
        }, 'タップ回数: ' + count)
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
